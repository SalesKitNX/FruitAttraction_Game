  img.onload=function(){ var w=img.width,h=img.height,m=680;
    if(w>h&&w>m){h=Math.round(h*m/w);w=m;} else if(h>=w&&h>m){w=Math.round(w*m/h);h=m;}

/* ===== SVG mini-charts ===== */
function ring(pct){ var s=92,st=10,r=(s-st)/2,circ=2*Math.PI*r,off=circ*(1-pct);
  return '<svg width="'+s+'" height="'+s+'" style="transform:rotate(-90deg)"><circle cx="'+s/2+'" cy="'+s/2+'" r="'+r+'" fill="none" stroke="'+C.line+'" stroke-width="'+st+'"/><circle cx="'+s/2+'" cy="'+s/2+'" r="'+r+'" fill="none" stroke="'+C.green+'" stroke-width="'+st+'" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'"/></svg>'; }
function barsV(data,h){ h=h||150; var max=Math.max(1,Math.max.apply(null,data.map(function(d){return d.v;})));
  var out='<div class="bars" style="height:'+h+'px">';
  data.forEach(function(d){ var bh=Math.round((d.v/max)*(h-26));
    out+='<div class="barcol"><div class="barval">'+d.v+'</div><div class="bar" style="height:'+bh+'px;background:'+d.color+'"></div><div class="barlab">'+esc(d.name)+'</div></div>'; });
  return out+'</div>'; }
function donut(data){ var total=data.reduce(function(a,d){return a+d.v;},0); if(total===0) return '';
  var s=128,r=52,cx=64,cy=64,circ=2*Math.PI*r,acc=0,segs='';
  data.forEach(function(d){ var frac=d.v/total,len=frac*circ,dash=len+" "+(circ-len),off=-acc*circ;
    segs+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+d.color+'" stroke-width="20" stroke-dasharray="'+dash+'" stroke-dashoffset="'+off+'"/>'; acc+=frac; });
  return '<svg width="'+s+'" height="'+s+'" style="transform:rotate(-90deg)">'+segs+'</svg>'; }

    return '<button class="assignbtn" style="border-color:'+a.color+'" data-action="assign" data-k="'+k+'"><span class="abname">'+esc(a.short)+'</span><span class="abpts" style="background:'+a.color+'">+'+a.points+'</span></button>'; }).join("");
  var ev=(state.extra||[]).slice().sort(function(a,b){ return (b.t||0)-(a.t||0); }).slice(0,40);
  var log=ev.length? ev.map(function(e){ var nm=(ACTIVITIES[e.act]&&ACTIVITIES[e.act].label)||e.label||"Extra points";
      return '<div class="feedrow"><span class="feedpts" style="background:'+((ACTIVITIES[e.act]&&ACTIVITIES[e.act].color)||"#4E7D2C")+'">+'+e.points+'</span>'
        +'<div class="feedmid"><div class="feedname">'+esc(nm)+'</div><div class="feedsub">'+esc(e.person||"team")+' · '+(e.t?new Date(e.t).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}):"")+'</div></div>'
        +'<button class="feeddel" data-action="unassign" data-id="'+esc(e.id)+'">✕</button></div>'; }).join("")
    : '<div class="muted center pad">No assignments yet for '+esc(TEAMS[state.scTeam].name)+'.</div>';
  return '<header class="hd"><div class="hdrow"><div class="brand"><div class="logotile"><img src="'+LOGO+'"/></div>'
      +'<div><div class="htitle">Extra points · Referee</div><div class="hsub"><span class="teamtag" style="background:#8E44AD">'+esc(u.name)+'</span></div></div></div>'
      +'<div class="teampts"><div class="big">🎖️</div></div></div>'
      +'<div class="hdrow2"><button class="userchip" data-action="logout">'+esc(u.name)+' · referee ⎋</button>'
      +'<span class="livepill '+(liveMode?"on":"")+'">'+(liveMode?"● Live":"○ Offline")+'</span>'
      +'<button class="msgbtn" data-action="compose">📣 Message</button>'+chatsBtn()+'</div></header>'
    +'<main>'
    +'<section class="card"><div class="ctitle">Assign points</div>'
      +'<div class="lbl">Team</div><select class="sel" data-action="scteam">'+teamOpts+'</select>'
      +'<div class="lbl">Person</div><select class="sel" data-action="scperson">'+persOpts+'</select>'
      +'<div class="lbl">Activity</div><div class="assigngrid">'+actBtns+'</div>'
      +'<div class="lbl">Custom points</div>'
      +'<div class="customrow"><input id="scpts" class="cinput" type="number" inputmode="numeric" placeholder="pts"/>'
      +'<input id="screason" class="cinput cgrow" placeholder="reason (optional)"/>'
      +'<button class="btn primary" data-action="assign-custom">Add</button></div>'
    +'</section>'
    +rankCard()
    +topIndCard()
    +'<section class="card"><div class="ctitle">Recent — '+esc(TEAMS[state.scTeam].name)+'</div><div class="clist">'+log+'</div></section>'
    +'</main>';
}
function modal(c){
  var s=statusOf(c.id); var st=STATUS[s];
  var photo=photoCache[c.id];
  var photoHtml = photo ? '<div class="photowrap"><img src="'+photo+'"/><label class="reptag">📷 Replace<input type="file" accept="image/*" capture="environment" data-action="photo" data-id="'+c.id+'" hidden></label><button class="rmtag" data-action="rmphoto" data-id="'+c.id+'">🗑 Remove</button></div>'
    : '<label class="photoadd">📷 Snap the business card<input type="file" accept="image/*" capture="environment" data-action="photo" data-id="'+c.id+'" hidden></label>';
  var links=""; if(c.website) links+='<a class="lnk" href="https://'+esc(c.website.replace(/^https?:\/\//,""))+'" target="_blank" rel="noreferrer">🌐 '+esc(c.website)+'</a>';
  if(c.email) links+='<a class="lnk" href="mailto:'+esc(c.email)+'">✉ '+esc(c.email)+'</a>';
  var r=rec(c.id);
  return '<div class="ovl" data-action="closebg"><div class="sheet" data-stop="1"><div class="grab"></div>'
    +'<div class="sheethd"><div><div class="badges"><span class="hallbadge" style="background:'+HALLS[c.hall].color+'">Hall '+c.hall+' · '+esc(c.stand)+'</span>'
      +'<span class="cpill" style="background:'+st.bg+';color:'+st.color+'">'+st.short+'</span></div><h2>'+esc(c.name)+'</h2>'
      +'<div class="muted small">'+esc([c.country,c.products].filter(Boolean).join(' · '))+'</div>'+(c.pavilion?'<div class="muted xsmall">'+esc(c.pavilion)+'</div>':'')+'</div>'
      +'<button class="xbtn" data-action="close">✕</button></div>'
    +(links?'<div class="links">'+links+'</div>':'')
    +trackSection(c)
    +'<div class="lbl">Business card / photo</div>'+photoHtml
    +'<div class="lbl">Notes</div><textarea id="notes" rows="3" placeholder="Who you met, what they need, follow-up...">'+esc(r.n||"")+'</textarea>'
    +(r.u?'<div class="muted xsmall mt">Last update by '+esc(r.u)+(r.t?' · '+new Date(r.t).toLocaleString():'')+'</div>':'')
    +'<button class="btn primary wide mt" data-action="close">Done</button></div></div>';
}
function wireNotes(){ var n=document.getElementById("notes"); if(n&&state.sel) n.addEventListener("input", function(e){ setNotes(state.sel.id,e.target.value); }); }
function openModal(c){ state.sel=c; var m=document.getElementById("modal"); m.innerHTML=modal(c); m.style.display="block";
  if(rec(c.id).p&&photoCache[c.id]===undefined){ getPhoto(c.id).then(function(v){ if(v){ photoCache[c.id]=v; if(state.sel&&state.sel.id===c.id){ m.innerHTML=modal(c); wireNotes(); } } }).catch(function(){}); }
  wireNotes(); }
function closeModal(){ state.sel=null; var m=document.getElementById("modal"); m.style.display="none"; m.innerHTML=""; render(); }

/* ===== Events ===== */
function findAction(el){ while(el&&el!==document){ if(el.getAttribute&&el.getAttribute("data-action")) return el; el=el.parentNode; } return null; }
document.body.addEventListener("click", function(e){ var el=findAction(e.target); if(!el) return; var a=el.getAttribute("data-action");
  if(a==="tab"){ state.tab=el.getAttribute("data-tab"); render(); }
  else if(a==="logout"){ logout(); }
  else if(a==="open"){ var id=+el.getAttribute("data-id"); var c=companies().filter(function(x){return x.id===id;})[0]; if(c) openModal(c); }
  else if(a==="status"){ setStatus(+el.getAttribute("data-id"), el.getAttribute("data-status")); if(state.sel){ document.getElementById("modal").innerHTML=modal(state.sel); wireNotes(); } }
  else if(a==="track"){ setTrack(+el.getAttribute("data-id"), el.getAttribute("data-track")); }
  else if(a==="close"){ closeModal(); }
  else if(a==="closebg"){ if(e.target===el) closeModal(); }
  else if(a==="fhall"){ state.fHall=el.getAttribute("data-val"); render(); }
  else if(a==="fstatus"){ state.fStatus=el.getAttribute("data-val"); render(); }
  else if(a==="xlsx"){ exportXLSX(); }
  else if(a==="cards"){ exportCards(); }
  else if(a==="rankexp"){ var tk=el.getAttribute("data-tk"); state.rankOpen = (state.rankOpen===tk?null:tk); render(); }
  else if(a==="assign"){ var k=el.getAttribute("data-k"); if(!state.scPerson){ toast("Pick a person"); return; }
      assignExtra(state.scTeam, {act:k, label:ACTIVITIES[k].label, points:ACTIVITIES[k].points, person:state.scPerson}); }
  else if(a==="assign-custom"){ var pv=parseInt((document.getElementById("scpts")||{}).value,10); if(!pv){ toast("Enter points"); return; }
      if(!state.scPerson){ toast("Pick a person"); return; }
      var rs=((document.getElementById("screason")||{}).value||"").trim();
      assignExtra(state.scTeam, {act:"custom", label:rs||"Extra points", points:pv, person:state.scPerson}); }
  else if(a==="unassign"){ removeExtra(state.scTeam, el.getAttribute("data-id")); }
  else if(a==="rmphoto"){ removePhoto(+el.getAttribute("data-id")); }
  else if(a==="dismiss"){ var mid=el.getAttribute("data-id"); if(dismissed.indexOf(mid)<0){ dismissed.push(mid); saveDismissed(); } renderPopups(); }
  else if(a==="compose"){ state.chats=false; state.compose=true; renderCompose(); renderPopups(); }
  else if(a==="react"){ var om=msgById(el.getAttribute("data-id")); if(om) sendReply(om, el.getAttribute("data-q"), "react"); }
  else if(a==="reply-open"){ state.replyOpen=el.getAttribute("data-id"); renderPopups(); var rt=document.getElementById("rtxt_"+state.replyOpen); if(rt) rt.focus(); }
  else if(a==="reply-cancel"){ state.replyOpen=null; renderPopups(); }
  else if(a==="reply-send"){ var rid=el.getAttribute("data-id"), rta=document.getElementById("rtxt_"+rid), rv=((rta&&rta.value)||"").trim();
      if(!rv){ toast("Write a reply first"); return; } var om2=msgById(rid); if(om2) sendReply(om2, rv, null); }
  else if(a==="chats"){ state.compose=false; state.chats=true; state.chatOpen=null; renderCompose(); renderPopups(); }
  else if(a==="chats-close"){ if(el.className==="ovl"&&e.target!==el) return; state.chats=false; state.chatOpen=null; renderCompose(); refreshChatsBadge(); renderPopups(); }
  else if(a==="chat-open"){ state.chatOpen=el.getAttribute("data-k"); markThreadRead(state.chatOpen); renderCompose(); refreshChatsBadge(); var sc=document.querySelector(".chatscroll"); if(sc) sc.scrollTop=sc.scrollHeight; }
  else if(a==="chat-back"){ state.chatOpen=null; renderCompose(); }
  else if(a==="chat-send"){ var ct=document.getElementById("chattxt"), cv=((ct&&ct.value)||"").trim(); if(!cv){ toast("Write a message first"); return; }
      var cp=state.chatOpen.split("|"), cAll=cp[0]==="all", ctk=cAll?cp[1]:cp[0], cwho=cAll?null:cp[1];
      if(!state.user.scorer&&ctk!==state.user.team){ toast("You can only message your team"); return; }
      addMessage(ctk,{text:cv,to:cAll?["all"]:[cwho],from:state.user.first,fromName:state.user.name,t:Date.now()}).then(function(){ toast("Sent"); }).catch(function(){ toast("Not sent - check connection"); });
      ct.value=""; }
  else if(a==="compose-cancel"){ if(el.className==="ovl"&&e.target!==el) return; state.compose=false; renderCompose(); renderPopups(); }
  else if(a==="compose-send"){ var txt=(document.getElementById("msgtext").value||"").trim(); if(!txt){ toast("Write a message first"); return; }
      if(state.user.scorer){ var everyone=document.getElementById("sceveryone").checked; var per={}; RANK_ORDER.forEach(function(tk){ per[tk]={whole:false,persons:[]}; });
        if(everyone){ RANK_ORDER.forEach(function(tk){ per[tk].whole=true; }); }
        else { var ws=document.querySelectorAll(".scwhole"); for(var wi=0;wi<ws.length;wi++){ if(ws[wi].checked) per[ws[wi].getAttribute("data-team")].whole=true; }
          var cs=document.querySelectorAll(".scchk"); for(var ci=0;ci<cs.length;ci++){ if(cs[ci].checked) per[cs[ci].getAttribute("data-team")].persons.push(cs[ci].value); } }
        var sent=0; RANK_ORDER.forEach(function(tk){ var pt=per[tk]; if(pt.whole){ addMessage(tk,{text:txt,to:["all"],from:"Ronit",fromName:"Ronit Ben Simon",t:Date.now()}).catch(function(){}); sent++; } else if(pt.persons.length){ addMessage(tk,{text:txt,to:pt.persons,from:"Ronit",fromName:"Ronit Ben Simon",t:Date.now()}).catch(function(){}); sent++; } });
        if(!sent){ toast("Pick recipients"); return; } toast("Message sent"); state.compose=false; renderCompose(); renderPopups(); return; }
      var teamKey=state.user.team;
      var to; if(document.getElementById("rcptall").checked){ to=["all"]; }
      else { to=[]; var chks=document.querySelectorAll(".rcptchk"); for(var i=0;i<chks.length;i++){ if(chks[i].checked) to.push(chks[i].value); } if(!to.length){ toast("Pick at least one person"); return; } }
      addMessage(teamKey, {text:txt, to:to, from:state.user.first, fromName:state.user.name, t:Date.now()}).then(function(){ toast("Message sent"); }).catch(function(){ toast("Message not sent"); });
      state.compose=false; renderCompose(); renderPopups(); }
});
document.body.addEventListener("change", function(e){ var el=e.target; if(!el) return;
  if(el.getAttribute&&el.getAttribute("data-action")==="scteam"){ state.scTeam=el.value; state.scPerson=""; if(FB) scorerSubscribe(); render(); return; }
  if(el.getAttribute&&el.getAttribute("data-action")==="scperson"){ state.scPerson=el.value; return; }
  if(el.getAttribute&&el.getAttribute("data-action")==="photo"){ var id=+el.getAttribute("data-id"); var f=el.files&&el.files[0]; if(!f) return;
    toast("Optimising photo..."); compressImage(f).then(function(data){ photoCache[id]=data;
      return putPhoto(id,data).then(function(){ var r=state.records[id]||{}; r.p=true; r.t=Date.now(); r.u=state.user?state.user.first:""; state.records[id]=r; saveRemote(id);
        if(state.sel&&state.sel.id===id){ document.getElementById("modal").innerHTML=modal(state.sel); wireNotes(); } toast("Photo saved"); }); }).catch(function(){ toast("Photo not saved"); }); }
});
document.body.addEventListener("input", function(e){ if(e.target&&e.target.id==="q"){ state.q=e.target.value; var pos=e.target.selectionStart; render(); var nq=document.getElementById("q"); if(nq){ nq.focus(); try{nq.setSelectionRange(pos,pos);}catch(_){} } } });

/* ===== Boot ===== */
loadLocal();
render();
initFirebase();

</script>
</body>
</html>
