<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#1E4D2B"/>
<title>Fruit Attraction 2026</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#EEF3E6;color:#173322;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{max-width:480px;margin:0 auto;padding-bottom:90px}
.muted{color:#7c8a72}.small{font-size:12px}.xsmall{font-size:11px}.center{text-align:center}.pad{padding:20px}.pad0{padding:2px 4px 0}.mt{margin-top:12px}
.rowbetween{display:flex;justify-content:space-between;padding:2px 4px}
button{font-family:inherit;cursor:pointer;border:none}
.btn{border-radius:12px;padding:12px;font-weight:700;font-size:14px}
.btn.primary{background:#1E4D2B;color:#fff}
.btn.ghost{background:#fff;color:#1E4D2B;border:1px solid #DCE6CF}
.btn.wide{width:100%}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#1E4D2B,#0f2a18)}
.loginbox{width:100%;max-width:320px;background:#fff;border-radius:24px;padding:26px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.loginlogo{width:64px;height:64px;object-fit:contain;border-radius:16px;margin-bottom:10px}
.loginbox h1{color:#1E4D2B;font-size:19px;margin:0 0 4px}
.loginbox input{width:100%;border:1px solid #DCE6CF;background:#f7f9f3;border-radius:12px;padding:11px;text-align:center;font-size:14px;margin-top:8px;outline:none}
.err{color:#e11;font-size:12px;font-weight:600;margin-top:8px;min-height:14px}
/* header */
.hd{position:sticky;top:0;z-index:20;padding:14px 16px 10px;background:linear-gradient(180deg,#1E4D2B 0%,#1E4D2B 78%,rgba(30,77,43,0) 100%)}
.hdrow{display:flex;align-items:center;justify-content:space-between;color:#fff}
.brand{display:flex;align-items:center;gap:10px}
.logotile{width:40px;height:40px;border-radius:12px;background:#fff;padding:4px;display:grid;place-items:center}
.logotile img{width:100%;height:100%;object-fit:contain}
.htitle{font-size:15px;font-weight:800;letter-spacing:-.2px}
.hsub{font-size:11px;opacity:.8}
.teampts{text-align:right;color:#fff}.teampts .big{font-size:24px;font-weight:900;line-height:1}
.teampts .cap{font-size:10px;text-transform:uppercase;opacity:.8}
.hdrow2{margin-top:8px}
.userchip{background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:600}
.tabs{display:flex;gap:4px;margin-top:8px;background:rgba(255,255,255,.16);padding:4px;border-radius:12px}
.tab{flex:1;border-radius:9px;padding:7px;font-weight:700;font-size:13px;background:transparent;color:#fff}
.tab.on{background:#fff;color:#1E4D2B}
/* cards */
main{padding:12px 16px}
.card{background:#fff;border:1px solid #DCE6CF;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.ctitle{font-size:13px;font-weight:700;margin-bottom:8px}
.cap{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#9aa6a0}
.hero{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:92px;height:92px}
.ringlab{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ringlab b{color:#1E4D2B;font-size:17px}.ringlab span{display:block;font-size:9px;text-transform:uppercase;color:#9aa6a0}
.herotxt{flex:1}.herobig{font-size:38px;font-weight:900;color:#1E4D2B;line-height:1}.herobig small{font-size:15px;color:#9aa6a0;margin-left:4px}
.grow2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;text-align:center;font-size:12px}
.grow2 .pill{border-radius:10px;padding:7px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.kpi{border-radius:12px;padding:8px 4px;text-align:center}
.kpi .kv{font-size:18px;font-weight:900}.kpi .kl{font-size:9px;font-weight:600;color:#7c8a72;margin-top:2px}
.bars{display:flex;align-items:flex-end;gap:6px;padding-top:6px}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bar{width:100%;max-width:44px;border-radius:6px 6px 0 0}
.barval{font-size:11px;font-weight:800;margin-bottom:3px}
.barlab{font-size:10px;color:#7c8a72;margin-top:4px;text-align:center}
.donutrow{display:flex;align-items:center;gap:12px}.donutwrap{width:128px;height:128px}
.leg{flex:1}.legrow{display:flex;justify-content:space-between;font-size:12px;padding:1px 0}
.legrow i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.actions{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:8px}
/* map */
.maplegend{display:flex;flex-wrap:wrap;gap:8px 12px;background:#fff;border:1px solid #DCE6CF;border-radius:12px;padding:8px 10px;font-size:11px;margin-bottom:8px}
.lg,.maplegend .lg{display:inline-flex;align-items:center;gap:4px}
.maplegend i{width:10px;height:10px;border-radius:50%}
.hallcard{background:#fff;border:1px solid #DCE6CF;border-radius:18px;overflow:hidden;margin-bottom:12px}
.hallhd{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;color:#fff}
.halll{display:flex;align-items:center;gap:8px}
.hallno{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.25);font-weight:900;font-size:13px}
.hn{font-size:14px;font-weight:800}.hnn{font-size:10px;opacity:.9}
.hallr{text-align:right}.hp{font-size:14px;font-weight:900}.hd2{font-size:10px;opacity:.9}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px}
.chip{flex:1 1 92px;max-width:140px;border-radius:9px;padding:6px 8px;text-align:left;display:flex;flex-direction:column;gap:1px}
.chip .cn{font-size:11px;font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.chip .cs{font-size:9px;font-weight:600;opacity:.9}
/* companies */
.searchbar{background:#fff;border:1px solid #DCE6CF;border-radius:12px;padding:2px 12px;margin-bottom:8px}
.searchbar input{width:100%;border:none;outline:none;padding:10px 0;font-size:14px;background:transparent}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}
.fchip{white-space:nowrap;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;background:#fff;border:1px solid #DCE6CF;color:#173322;display:inline-flex;align-items:center;gap:4px}
.fchip.on{background:#1E4D2B;color:#fff}
.fchip i{width:8px;height:8px;border-radius:50%}
.sep{width:1px;background:#DCE6CF;flex:0 0 1px}
.clist{display:flex;flex-direction:column;gap:8px}
.ccard{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #DCE6CF;border-radius:16px;padding:12px;text-align:left;width:100%}
.hbadge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:900;flex:0 0 40px}
.cmid{flex:1;min-width:0}
.cname{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmeta{font-size:11px;color:#7c8a72;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;margin-top:5px}
.chev{color:#c7cfbe;font-size:22px}
/* modal */
#modal{display:none}
.ovl{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;padding:16px 16px 24px;max-height:90vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.3)}
.grab{width:40px;height:5px;border-radius:99px;background:#e3e3e3;margin:0 auto 12px}
.sheethd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sheethd h2{font-size:18px;font-weight:800;margin:6px 0 2px}
.badges{display:flex;gap:8px;align-items:center}
.hallbadge{color:#fff;border-radius:6px;padding:2px 6px;font-size:11px;font-weight:900}
.xbtn{background:none;color:#9aa6a0;font-size:18px;padding:4px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lnk{display:inline-flex;align-items:center;gap:6px;background:#EEF3E6;color:#1E4D2B;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:600;text-decoration:none}
.lbl{font-size:12px;font-weight:700;color:#7c8a72;margin:16px 0 6px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sbtn{border-radius:12px;padding:12px 4px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.sbtn small{font-size:10px;opacity:.85}
.photowrap{position:relative;border:1px solid #DCE6CF;border-radius:12px;overflow:hidden}
.photowrap img{width:100%;max-height:260px;object-fit:contain;background:#fafafa;display:block}
.reptag{position:absolute;bottom:8px;right:8px;background:rgba(255,255,255,.92);color:#1E4D2B;border-radius:8px;padding:4px 8px;font-size:11px;font-weight:600;cursor:pointer}
.photoadd{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed #DCE6CF;border-radius:12px;padding:22px;color:#4E7D2C;font-size:14px;font-weight:600;cursor:pointer}
textarea{width:100%;border:1px solid #DCE6CF;background:#f7f9f3;border-radius:12px;padding:12px;font-size:14px;font-family:inherit;resize:none;outline:none}
#toast{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#173322;color:#fff;border-radius:999px;padding:10px 18px;font-size:13px;font-weight:600;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.3)}

.hdrow2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.livepill{font-size:10px;font-weight:700;color:#fff;background:rgba(255,255,255,.16);border-radius:999px;padding:3px 8px}
.livepill.on{background:#4CA226}
.msgbtn{font-size:11px;font-weight:700;color:#1E4D2B;background:#8BC53F;border-radius:999px;padding:3px 10px}
.actions1{margin-bottom:8px}
/* message popups */
#popups{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:55;width:100%;max-width:440px;padding:0 12px;display:flex;flex-direction:column;gap:8px}
.popup{background:#fff;border:1px solid #DCE6CF;border-left:5px solid #6CA22A;border-radius:14px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.popuphd{display:flex;justify-content:space-between;align-items:center}
.popupfrom{font-size:12px;font-weight:800;color:#1E4D2B}
.popupx{background:none;color:#9aa6a0;font-size:15px;padding:2px 4px}
.popuptxt{font-size:14px;margin-top:2px;white-space:pre-wrap;word-break:break-word}
.popuptime{font-size:10px;color:#9aa6a0;margin-top:4px;text-align:right}
/* compose */
#compose{display:none}
.rcpt{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#f7f9f3;border:1px solid #DCE6CF;border-radius:10px;padding:8px 12px;margin:0 6px 6px 0}
.rcptall{background:#EDF4E1}
.rcptlist{margin-top:2px}
</style>
</head>

<div id="modal"></div>
<div id="compose"></div>
<div id="popups"></div>
<div id="toast"></div>

/* ===== Firebase realtime sync ===== */
var TEAM="fa26-68cb341507e58d81";
var remoteSet=null, remoteSub=null, liveMode=false, unsub=null, lastSync=0;
function saveRemote(id){ if(!remoteSet) return; try{ remoteSet(String(id), state.records[id]||{}).catch(function(){}); }catch(e){} }
function startSync(){ if(!remoteSub) return; if(unsub){try{unsub();}catch(e){}}
  unsub=remoteSub(function(snap){ var recs={}; snap.forEach(function(d){ recs[d.id]=d.data(); });
    state.records=recs; liveMode=true; lastSync=Date.now(); saveRecords(); render();
  }, function(){ liveMode=false; render(); });
  if(remoteMsgSub){ if(msgUnsub){try{msgUnsub();}catch(e){}}
    msgUnsub=remoteMsgSub(function(snap){ var arr=[]; snap.forEach(function(d){ var o=d.data()||{}; o.id=d.id; arr.push(o); });
      state.messages=arr; renderPopups();
    }, function(){}); } }
function initFirebase(){
  Promise.all([
    import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js")
  ]).then(function(mods){ var initializeApp=mods[0].initializeApp; var ff=mods[1];
    var appF=initializeApp(FIREBASE_CONFIG); var db=ff.getFirestore(appF);
    remoteSet=function(id,data){ return ff.setDoc(ff.doc(db,"teams",TEAM,"records",id), data, {merge:true}); };
    remoteSub=function(cb,err){ return ff.onSnapshot(ff.collection(db,"teams",TEAM,"records"), cb, err); };
    remotePhotoSet=function(id,data){ return ff.setDoc(ff.doc(db,"teams",TEAM,"photos",id), {d:data, u:(state.user?state.user.name:""), t:Date.now()}); };
    remotePhotoGet=function(id){ return ff.getDoc(ff.doc(db,"teams",TEAM,"photos",id)).then(function(s){ return s.exists()?(s.data().d||null):null; }); };
    remoteMsgAdd=function(m){ return ff.addDoc(ff.collection(db,"teams",TEAM,"messages"), m); };
    remoteMsgSub=function(cb,err){ return ff.onSnapshot(ff.collection(db,"teams",TEAM,"messages"), cb, err); };
    startSync();
  }).catch(function(){ liveMode=false; render(); });
}

/* ===== Helpers ===== */
function rec(id){ return state.records[id] || {}; }
function statusOf(id){ return (state.records[id] && state.records[id].s) || "not_started"; }
function inScope(c){ var sc = state.user ? state.user.scope : "ALL"; return sc==="ALL" || c.group===sc; }
function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function totals(){
  var pts=0, byGroup={A:0,B:0}, byHall={8:0,10:0,12:0,14:0}, counts={}, done=0;
  STATUS_ORDER.forEach(function(k){counts[k]=0;});
  COMPANIES.forEach(function(c){ var s=statusOf(c.id); counts[s]++; var p=STATUS[s].points;
    pts+=p; byGroup[c.group]+=p; byHall[c.hall]+=p; if(s!=="not_started") done++; });
  return { pts:pts, byGroup:byGroup, byHall:byHall, counts:counts, done:done,
    coverage:done/COMPANIES.length,
    contacts:counts.contact+counts.appt_stand+counts.appt_company+counts.sale,
    appts:counts.appt_stand+counts.appt_company, sales:counts.sale };
}
function setStatus(id,s){ var who=state.user?state.user.name:""; var r=state.records[id]||{};
  r.s=s; r.t=Date.now(); r.u=who; state.records[id]=r; saveRecords(); render(); saveRemote(id); }
var notesTimer=null;
function setNotes(id,n){ var r=state.records[id]||{}; r.n=n; r.t=Date.now(); r.u=state.user?state.user.name:""; state.records[id]=r;
  clearTimeout(notesTimer); notesTimer=setTimeout(function(){ saveRecords(); saveRemote(id); },500); }

function compressImage(file){ return new Promise(function(res,rej){ var url=URL.createObjectURL(file); var img=new Image();
  img.onload=function(){ var w=img.width,h=img.height,m=680;
    if(w>h&&w>m){h=Math.round(h*m/w);w=m;} else if(h>=w&&h>m){w=Math.round(w*m/h);h=m;}
    var cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url);
    var q=0.55, out=cv.toDataURL("image/jpeg",q);
    while(out.length>900000 && q>0.3){ q-=0.1; out=cv.toDataURL("image/jpeg",q); }
    res(out); };
  img.onerror=rej; img.src=url; }); }

function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.style.display="block";

/* ===== Export to Excel (.xlsx, integrable with the master workbook) ===== */
function download(name, blob){ var url=URL.createObjectURL(blob); var a=document.createElement("a"); a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url); }
function buildRows(){ var src=COMPANIES.filter(inScope);
  return src.map(function(c){ var r=rec(c.id); var st=STATUS[statusOf(c.id)];
    return { Company:c.name, Hall:c.hall, Stand:c.stand, Country:c.country, Products:c.products, Group:c.group,
      Status:st.label, Points:st.points, Contact:c.email, Website:c.website, Photo:r.p?"Yes":"",
      "Updated by":r.u||"", "Updated at":r.t?new Date(r.t).toLocaleString():"", Notes:r.n||"" }; }); }
function exportCSVfallback(){ var rows=buildRows();
  var cols=Object.keys(rows[0]); var lines=[cols.join(",")];
  rows.forEach(function(o){ lines.push(cols.map(function(k){ var v=o[k]==null?"":String(o[k]); return '"'+v.replace(/"/g,'""')+'"'; }).join(",")); });
  download("FruitAttraction2026_"+new Date().toISOString().slice(0,10)+".csv", new Blob([lines.join("\r\n")],{type:"text/csv"}));
  toast("Exported CSV (opens in Excel)"); }
function exportXLSX(){
  toast("Building Excel...");
  import("https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs").then(function(XLSX){
    var t=totals();
    var ws=XLSX.utils.json_to_sheet(buildRows());
    ws["!cols"]=[{wch:32},{wch:6},{wch:9},{wch:14},{wch:30},{wch:7},{wch:15},{wch:7},{wch:28},{wch:22},{wch:7},{wch:14},{wch:20},{wch:30}];
    var summary=[{Metric:"Team total points",Value:t.pts},{Metric:"Group A points",Value:t.byGroup.A},
      {Metric:"Group B points",Value:t.byGroup.B},{Metric:"Companies worked",Value:t.done+" / "+COMPANIES.length},
      {Metric:"Contacts+",Value:t.contacts},{Metric:"Appointments",Value:t.appts},{Metric:"Sales",Value:t.sales},{},
      {Metric:"Visited",Value:t.counts.visited},{Metric:"Contact",Value:t.counts.contact},
      {Metric:"Appt @ stand",Value:t.counts.appt_stand},{Metric:"Appt @ company",Value:t.counts.appt_company},
      {Metric:"Sale",Value:t.counts.sale},{},{Metric:"Exported by",Value:state.user?state.user.name:""},{Metric:"Exported",Value:new Date().toLocaleString()}];
    var ws2=XLSX.utils.json_to_sheet(summary); ws2["!cols"]=[{wch:22},{wch:22}];
    var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Data"); XLSX.utils.book_append_sheet(wb,ws2,"Summary");
    var out=XLSX.write(wb,{type:"array",bookType:"xlsx"});
    download("FruitAttraction2026_"+new Date().toISOString().slice(0,10)+".xlsx", new Blob([out],{type:"application/octet-stream"}));
    toast("Excel exported");
  }).catch(function(){ exportCSVfallback(); });
}

/* ===== SVG mini-charts ===== */
function ring(pct){ var s=92,st=10,r=(s-st)/2,circ=2*Math.PI*r,off=circ*(1-pct);
  return '<svg width="'+s+'" height="'+s+'" style="transform:rotate(-90deg)">'
    +'<circle cx="'+s/2+'" cy="'+s/2+'" r="'+r+'" fill="none" stroke="'+C.line+'" stroke-width="'+st+'"/>'
    +'<circle cx="'+s/2+'" cy="'+s/2+'" r="'+r+'" fill="none" stroke="'+C.green+'" stroke-width="'+st+'" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'"/></svg>'; }
function barsV(data, h){ h=h||150; var max=Math.max(1,Math.max.apply(null,data.map(function(d){return d.v;})));
  var n=data.length, bw=Math.min(46,(100/n)-4);
  var out='<div class="bars" style="height:'+h+'px">';
  data.forEach(function(d){ var bh=Math.round((d.v/max)*(h-26));
    out+='<div class="barcol"><div class="barval">'+d.v+'</div><div class="bar" style="height:'+bh+'px;background:'+d.color+'"></div><div class="barlab">'+esc(d.name)+'</div></div>'; });
  return out+'</div>'; }
function donut(data){ var total=data.reduce(function(a,d){return a+d.v;},0); if(total===0) return '';
  var s=128,r=52,cx=64,cy=64,circ=2*Math.PI*r,acc=0; var segs='';
  data.forEach(function(d){ var frac=d.v/total; var len=frac*circ; var dash=len+" "+(circ-len); var off=-acc*circ;
    segs+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+d.color+'" stroke-width="20" stroke-dasharray="'+dash+'" stroke-dashoffset="'+off+'"/>'; acc+=frac; });
  return '<svg width="'+s+'" height="'+s+'" style="transform:rotate(-90deg)">'+segs+'</svg>'; }

/* ===== Render ===== */
var app;
function render(){
  app = app || document.getElementById("app");
  if(!state.user){ app.innerHTML = loginView(); wireLogin(); renderPopups(); renderCompose(); return; }
  var t=totals();
  var html = header(t);
  if(state.tab==="dashboard") html += dashboard(t);
  else if(state.tab==="map") html += mapView(t);
  else html += companiesView();
  app.innerHTML = html;
  renderPopups(); renderCompose();
}

function wireLogin(){
  var go=function(){ var name=(document.getElementById("lname").value||"").trim().toLowerCase();
    var pwd=REQUIRE_PASSWORD?(document.getElementById("lpwd").value||""):"";
    var err=document.getElementById("lerr");
    var u=USERS[name];
    if(REQUIRE_PASSWORD){ var need=(u&&u.pwd)?u.pwd:ACCESS_PASSWORD; if(pwd!==need){ err.textContent="Wrong password."; return; } }
    if(!u){ err.textContent="Name not recognised. Ask Matteo for access."; return; }
    state.user=u; if(u.scope!=="ALL") state.fGroup=u.scope; saveUser(); render(); };
  document.getElementById("lbtn").onclick=go;
  var ln=document.getElementById("lname"); ln.focus();
  var handler=function(e){ if(e.key==="Enter") go(); };
  ln.addEventListener("keydown",handler);
  if(REQUIRE_PASSWORD) document.getElementById("lpwd").addEventListener("keydown",handler);
}

      +'<div class="hbadge" style="background:'+(c.group==="A"?C.green:C.lime)+';color:'+(c.group==="A"?"#fff":C.greenD)+'">H'+c.hall+'</div>'
      +'<div class="cmid"><div class="cname">'+esc(c.name)+(r.p?' 📷':'')+'</div>'
      +'<div class="cmeta">'+esc(c.stand)+' · '+esc(c.country)+' · '+esc(c.products)+'</div>'
      +'<div class="cpill" style="background:'+st.bg+';color:'+st.color+'">'+st.short+'</div></div><div class="chev">›</div></button>'; }).join("");
  return '<main>'
    +'<div class="searchbar"><input id="q" placeholder="Search company, country, product..." value="'+esc(state.q)+'"/></div>'
    +'<div class="filters">'+gfilters+sfilters+'</div>'
    +'<div class="muted small rowbetween"><span>'+list.length+' companies</span><span>tap a card to update</span></div>'
    +'<div class="clist">'+(cards||'<div class="muted center pad">Nothing matches these filters.</div>')+'</div>'
  +'</main>';
}

function modal(c){
  var s=statusOf(c.id); var st=STATUS[s];
  var sbtns=STATUS_ORDER.map(function(k){ var x=STATUS[k]; var on=s===k;
    var style=on?('background:'+x.color+';color:#fff'):('background:'+x.bg+';color:'+x.color);
    return '<button class="sbtn" style="'+style+'" data-action="status" data-id="'+c.id+'" data-status="'+k+'">'
      +'<span>'+x.short+'</span><small>+'+x.points+'</small></button>'; }).join("");
  var photo=photoCache[c.id];
  var photoHtml = photo
    ? '<div class="photowrap"><img src="'+photo+'"/><label class="reptag">📷 Replace<input type="file" accept="image/*" capture="environment" data-action="photo" data-id="'+c.id+'" hidden></label></div>'
    : '<label class="photoadd">📷 Snap the business card<input type="file" accept="image/*" capture="environment" data-action="photo" data-id="'+c.id+'" hidden></label>';
  var links="";
  if(c.website) links+='<a class="lnk" href="https://'+esc(c.website.replace(/^https?:\/\//,""))+'" target="_blank" rel="noreferrer">🌐 '+esc(c.website)+'</a>';
  if(c.email) links+='<a class="lnk" href="mailto:'+esc(c.email)+'">✉ '+esc(c.email)+'</a>';
  var r=rec(c.id);
  return '<div class="ovl" data-action="closebg"><div class="sheet" data-stop="1">'
    +'<div class="grab"></div>'
    +'<div class="sheethd"><div><div class="badges"><span class="hallbadge" style="background:'+HALLS[c.hall].color+'">Hall '+c.hall+' · '+esc(c.stand)+'</span>'
      +'<span class="cpill" style="background:'+st.bg+';color:'+st.color+'">'+st.short+'</span></div>'
      +'<h2>'+esc(c.name)+'</h2><div class="muted small">'+esc(c.country)+' · '+esc(c.products)+'</div>'
      +(c.pavilion?'<div class="muted xsmall">'+esc(c.pavilion)+'</div>':'')+'</div>'
      +'<button class="xbtn" data-action="close">✕</button></div>'
    +(links?'<div class="links">'+links+'</div>':'')
    +'<div class="lbl">Set status</div><div class="sgrid">'+sbtns+'</div>'
    +'<div class="lbl">Business card / photo</div>'+photoHtml
    +'<div class="lbl">Notes</div><textarea id="notes" rows="3" placeholder="Who you met, what they need, follow-up...">'+esc(r.n||"")+'</textarea>'
    +(r.u?'<div class="muted xsmall mt">Last update by '+esc(r.u)+(r.t?' · '+new Date(r.t).toLocaleString():'')+'</div>':'')
    +'<button class="btn primary wide mt" data-action="close">Done</button>'
  +'</div></div>';
}
function openModal(c){ state.sel=c; var m=document.getElementById("modal"); m.innerHTML=modal(c); m.style.display="block";
  if(rec(c.id).p && photoCache[c.id]===undefined){ getPhoto(c.id).then(function(v){ if(v){ photoCache[c.id]=v; if(state.sel&&state.sel.id===c.id){ m.innerHTML=modal(c); m.style.display="block"; } } }).catch(function(){}); }
  var n=document.getElementById("notes"); if(n) n.addEventListener("input",function(e){ setNotes(c.id,e.target.value); }); }
function closeModal(){ state.sel=null; var m=document.getElementById("modal"); m.style.display="none"; m.innerHTML=""; render(); }

/* ===== Events ===== */
function findAction(el){ while(el && el!==document){ if(el.getAttribute && el.getAttribute("data-action")) return el; el=el.parentNode; } return null; }
document.addEventListener("click", function(e){
  var el=findAction(e.target); if(!el) return;
  var a=el.getAttribute("data-action");
  if(a==="tab"){ state.tab=el.getAttribute("data-tab"); render(); }
  else if(a==="logout"){ state.user=null; state.tab="dashboard"; state.fGroup="all"; saveUser(); render(); }
  else if(a==="open"){ var id=+el.getAttribute("data-id"); var c=COMPANIES.filter(function(x){return x.id===id;})[0]; if(c) openModal(c); }
  else if(a==="status"){ setStatus(+el.getAttribute("data-id"), el.getAttribute("data-status")); if(state.sel){ document.getElementById("modal").innerHTML=modal(state.sel); var n=document.getElementById("notes"); if(n)n.addEventListener("input",function(ev){setNotes(state.sel.id,ev.target.value);}); } }
  else if(a==="close"){ closeModal(); }
  else if(a==="closebg"){ if(e.target===el) closeModal(); }
  else if(a==="fgroup"){ state.fGroup=el.getAttribute("data-val"); render(); }
  else if(a==="fstatus"){ state.fStatus=el.getAttribute("data-val"); render(); }
  else if(a==="xlsx"){ exportXLSX(); }
  else if(a==="dismiss"){ var mid=el.getAttribute("data-id"); if(dismissed.indexOf(mid)<0){ dismissed.push(mid); saveDismissed(); } renderPopups(); }
  else if(a==="compose"){ state.compose=true; renderCompose(); }
  else if(a==="compose-cancel"){ if(a==="compose-cancel" && el.className==="ovl" && e.target!==el) return; state.compose=false; renderCompose(); }
  else if(a==="compose-send"){ var txt=(document.getElementById("msgtext").value||"").trim();
      if(!txt){ toast("Write a message first"); return; }
      var to; if(document.getElementById("rcptall").checked){ to=["all"]; }
      else { to=[]; var chks=document.querySelectorAll(".rcptchk"); for(var i=0;i<chks.length;i++){ if(chks[i].checked) to.push(chks[i].value); }
        if(!to.length){ toast("Pick at least one person"); return; } }
      sendMessage(txt, to); state.compose=false; renderCompose(); }
});
document.addEventListener("input", function(e){
  if(e.target && e.target.id==="q"){ state.q=e.target.value; var v=e.target.value;
    // re-render list only, keep focus
    var main=document.querySelector("main"); if(main){ // lightweight: full render then restore focus/caret
      var pos=e.target.selectionStart; render(); var nq=document.getElementById("q"); if(nq){ nq.focus(); try{nq.setSelectionRange(pos,pos);}catch(_){} } }
  }
});
document.addEventListener("change", function(e){
  var el=e.target; if(!el) return;
  if(el.getAttribute && el.getAttribute("data-action")==="photo"){ var id=+el.getAttribute("data-id"); var f=el.files&&el.files[0]; if(!f) return;
    toast("Optimising photo..."); compressImage(f).then(function(data){ photoCache[id]=data;
      return putPhoto(id,data).then(function(){ var r=state.records[id]||{}; r.p=true; r.t=Date.now(); r.u=state.user?state.user.name:""; state.records[id]=r; saveRecords(); saveRemote(id);
        if(state.sel&&state.sel.id===id){ document.getElementById("modal").innerHTML=modal(state.sel); } toast("Photo saved"); }); })
      .catch(function(){ toast("Photo not saved"); }); }
});

/* ===== Boot ===== */
loadLocal();
render();
initFirebase();

</script>
</body>
</html>
